# Local development PostgreSQL for ai_prof
# Usage:  docker compose -f database/compose.yml up -d
#         (schema.sql + seed.sql auto-run on first init via /docker-entrypoint-initdb.d)
# Reset:  docker compose -f database/compose.yml down -v
services:
  postgres:
    image: postgres:16
    container_name: ai_prof_postgres
    environment:
      POSTGRES_USER: ai_prof
      POSTGRES_PASSWORD: ai_prof
      POSTGRES_DB: ai_prof
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_prof -d ai_prof"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
