[project]
name = "ai-prof"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "headroom-ai[all]>=0.37.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=3.2.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.2",
    "livekit-agents>=1.8.1",
    "livekit-plugins-cartesia>=1.8.1",
    "livekit-plugins-deepgram>=1.8.1",
    "livekit-plugins-silero>=1.8.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
