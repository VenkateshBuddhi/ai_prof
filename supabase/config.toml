# The local Supabase CLI needs a Postgres version here; Supabase supports 15/16.
# pg_cron + pg_net stay off locally: the validation rig provisions a stock
# Postgres container, and scheduling is documented in supabase/README.md.
[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
